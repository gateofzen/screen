<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEELCYCLE Visualizer - Black is Black</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 背景（ミラーボール / レーザー） */
        #bgLayer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        /* ミラーボール：床（奥に倒した平面）の上で光がゆっくり回る */
        #bgLayer .floor  { position: absolute; transform-origin: 50% 50%; }
        #bgLayer .bgMove { position: absolute; inset: 0; will-change: transform; }
        #bgLayer .bgSet  { position: absolute; inset: 0; will-change: opacity; opacity: 0; }
        #bgLayer canvas  { position: absolute; top: 0; left: 0; }
        /* 個別に瞬く光（ロゴのマスの形。瞬きはGPU側のアニメーションで動くので軽い） */
        #bgLayer .twk {
            position: absolute;
            opacity: 0;
            will-change: opacity;
            animation: twk var(--d) linear var(--dl) infinite;
        }
        #bgLayer .twk svg { width: 100%; height: 100%; display: block; overflow: visible; }
        @keyframes twk {
            0%   { opacity: 0; }
            12%  { opacity: 1; }
            35%  { opacity: 0; }
            100% { opacity: 0; }
        }


        /* ストロボ：背景とロゴの間に置いた白い光（透明度だけ変えるのでGPU側で処理され軽い） */
        #strobe {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            will-change: opacity;
        }

        #visualizer-container {
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            width: 90vmin;
            height: 90vmin;
            max-width: 95vw;
            max-height: 95vh;
            position: relative;
        }

        /* 丸ロゴ用レイヤー
           #spinLayer（回転）> #pulseLayer（拡大）> 発光・ロゴ
           回転と拡大はブラウザのアニメーション機能で動かす（GPU側で処理されるので、
           色の更新などで処理が詰まっても動きはカクつかない） */
        #spinLayer, #pulseLayer, #logoLayer, #glowLayer {
            position: absolute;
            inset: 0;
            /* 丸ロゴの中心（SVG座標 311.63, 240.88）を回転・拡大の中心にする */
            transform-origin: 50.836% 39.377%;
            pointer-events: none;
        }
        #spinLayer, #pulseLayer { will-change: transform; }
        /* 丸ロゴの発光：ぼかしは最初に1回だけ描き、毎フレームは色と濃さだけ変える（軽い） */
        #glowLayer { will-change: filter; }
        #glowLayer > div {
            position: absolute;
            inset: 0;
            will-change: opacity;
        }
        #logoLayer svg, #glowLayer svg { width: 100%; height: 100%; overflow: visible; }

        svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: none !important;
        }

        /* すべてのパスの基本設定 */
        path {
            stroke: none !important; 
            /* ★重要: これでPやRの穴が確実に開きます */
            fill-rule: evenodd !important; 
        }

        /* 文字（黒いパーツ）は常に黒！ */
        path.static-text {
            fill: #000000 !important;
            filter: none !important;
        }

        #startButton {
            position: absolute;
            bottom: 5vh;
            z-index: 100;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            letter-spacing: 2px;
            -webkit-tap-highlight-color: transparent;
        }
        /* 調整パネル（画面をダブルタップで表示/非表示） */
        #syncPanel {
            position: fixed;
            right: 12px;
            bottom: 10px;
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.55);
            z-index: 200;
            user-select: none;
            -webkit-user-select: none;
        }
        /* 今かかっている曲（左上） */
        #nowPlaying {
            position: fixed;
            left: 3vw;
            top: 3vh;
            z-index: 150;
            color: #fff;
            font-family: Arial, 'Helvetica Neue', sans-serif;
            font-size: clamp(16px, 3.2vmin, 44px);
            line-height: 1.3;
            letter-spacing: 0.02em;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            max-width: 60vw;
        }
        #nowPlaying div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #npStatus { max-width: 22vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #syncPanel button {
            min-width: 40px;
            height: 34px;
            font-size: 16px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>

    <button id="startButton">SYSTEM START</button>
    <div id="nowPlaying"><div class="np-title"></div><div class="np-artist"></div><div class="np-program"></div></div>
    <div id="syncPanel">
        <span id="bpmLabel">BPM --</span>
        <span>｜補正</span>
        <button id="offsetMinus">−</button>
        <span id="offsetLabel">0ms</span>
        <button id="offsetPlus">＋</button>
        <button id="bgToggle" style="min-width:110px">背景</button>
        <button id="npToggle" style="min-width:72px">曲名</button>
        <button id="npKey" style="min-width:64px">APIキー</button>
        <span id="npStatus"></span>
        <button id="bingoLink" style="min-width:72px">ビンゴへ</button>
    </div>

    <script>
    const visualizerContainer = document.getElementById('visualizer-container');
    const svgElement = document.getElementById('svg');
    const startButton = document.getElementById('startButton');
    
    let logoPaths = []; 
    let glowGroup = null; 
    let circleLogo = null;   // 丸いロゴ
    let logoLayer = null, glowLayer = null, glowTight = null, glowWide = null;
    let spinLayer = null, pulseLayer = null;

    // ===== 動きの設定（ここの数字を変えると動き方を調整できます） =====
    const CFG = {
        // --- 回転（BPMに比例した一定速度） ---
        direction: 1,      // 1 = 時計回り, -1 = 反時計回り
        degPerBeat: 22.5,  // 1拍あたりに回る角度。22.5 = 16拍（4小節）で1回転 / 45 = 8拍で1回転
        idleSpeed: 0,      // 音楽がない時（キックが途切れた時）の回転速度（度/秒）。0 = 止める

        // --- 拡大（拍に合わせて毎拍同じ動きを繰り返す） ---
        pulseEnabled: false, // 拡大のON/OFF（今は回転のみ。true にすると拍に合わせて拡大）

        // --- 幾何学模様のマス：ミラーボール風の光 ---
        cellsEnabled: true,  // マスの光のON/OFF
        cellFillCenter: false, // 中央の大きな八角形も光らせるか
        ballTint: 0.3,       // 光に淡い色が混じる割合（0 = すべて白, 1 = すべて色付き）
        beatFlashMin: 6,     // 拍の頭でキラッと光るマスの数（静かな時）
        beatFlashMax: 14,    // 同（低音が大きい時）
        beatFlashDecay: 0.12,// 拍の頭の光が消える速さ（秒。小さいほど鋭い）
        sparkleRate: 1.6,    // 拍の間のランダムな瞬き（1マスあたり1秒に何回。音が大きい時）
        sparkleDecay: 0.07,  // 瞬きが消える速さ（秒）
        glintLights: [-135, 45], // 固定の光源の方向（度。0 = 右, -90 = 上）。回転するマスがここを通ると光る
        glintWidth: 9,       // 光源の前を通る時に光る範囲（度）
        glintStrength: 0.3,  // その光の強さ（0〜1）
        facetBase: 0,        // 音楽が鳴っている間、マスをうっすら見せておく濃さ（0 = 真っ黒）

        // --- 背景（調整パネルのボタンで「ミラーボール ⇔ なし」を切り替え） ---
        bgType: 'mirror',    // 'mirror' = ミラーボール / 'off' = なし（初期値。パネルで変えると端末に保存）

        // ミラーボール：ロゴのミラーボールから床に映った光（光の形はロゴのマスの形）
        mbSecondsPerRev: 60, // 床の光が1周するのにかかる秒数（ロゴの回転とは独立。大きいほどゆっくり）
        mbSpots: 260,        // 床に映る光の数（1組あたり。床の広さ900pxの時の数で、床が広いほど自動で増やす）
        mbSets: 2,           // 光の組の数。拍ごとに交互にフラッシュする（4拍に1回は全部同時）
        mbTwinkleSpots: 40,  // 上とは別に、常にチカチカ瞬く光の数（0 で無し）
        mbSpotSize: [22, 50],// 光の大きさ（px、床の上での大きさ。手前ほど大きく、奥ほど小さく見える）
        mbFloorTilt: 42,     // 床の傾き（度）。大きいほど床を浅い角度から見る感じになる
        mbFloorRadius: 1250, // 床の広さの上限（半径px）。実際の広さは画面の四隅まで届くよう自動で計算する
        mbFloorY: 0.42,      // 床の光の回転の中心の、画面上の高さ（0 = 上端, 1 = 下端）。小さいほど上
        mbTint: 0.15,        // 淡い色が混じる割合
        mbBase: 0,           // 拍と拍の間の明るさ（0 = 拍の瞬間だけ光る）
        mbFlash: 1,          // 拍の瞬間の明るさ
        mbFlashDecay: 0.15,  // 拍の光が消える速さ（秒。小さいほど鋭いフラッシュ）

        // --- ストロボ（拍の頭で、ロゴの周りの空間がパッと白く光る） ---
        strobeEnabled: true,
        strobeBeat: 0.18,    // 毎拍の光の強さ（0〜1）
        strobeBar: 0.45,     // 4拍に1回の光の強さ
        strobeMs: 220,       // 光が消えるまでの時間（ミリ秒）

        // --- 今かかっている曲の表示（音楽認識サービス AudD → CADENCE で照合） ---
        npService: 'acrcloud',  // 使う認識サービス：'acrcloud' = ACRCloud / 'audd' = AudD
        //   ACRCloud のホスト・アクセスキー・シークレットは、調整パネルの「APIキー」ボタンで入力
        //   （このタブレットにだけ保存され、ファイルには書かれない）
        npApiUrl: 'https://api.audd.io/',   // AudD の送り先
        npCadenceBase: 'https://gateofzen.github.io/feelcycle-setlist/',  // CADENCE の公開URL（データをここから読む）
        npClipSec: 10,       // 認識に使う録音の長さ（秒）。AudD は 12 秒まで
        npStartDelaySec: 3,  // 音楽が始まってから最初に認識するまでの秒数
        npIntervalSec: 30,   // 定期確認の間隔（秒）。曲の切り替わりを見逃した時の保険。短いほど回数（費用）が増える
        npRetrySec: 4,       // 認識できなかった時、再挑戦するまでの秒数（3回続けて失敗したら3倍に延ばす）
        npTimeoutSec: 15,    // 認識サービスから応答が無い時に打ち切るまでの秒数
        npAfterEndSec: 8,    // 曲の残り時間から計算した「曲の終わり」の何秒後に確認するか（DJのつなぎの分）
        npChangeThreshold: 0.06, // 音の雰囲気（キー・音域のバランス）の変化がこれを超えたら新しい曲の候補（パネルの「変化」の値で調整）
        npChangeHoldSec: 3,  // 変化がこの秒数続いたら、すぐ確認する
        npChangeWindow: 6,   // 「今の雰囲気」を何秒の平均で見るか（長いほど曲の中のコード進行に惑わされにくいが、気づくのが遅れる）
        npRefWindow: 45,     // 「この曲の雰囲気」がどのくらいゆっくり追従するか（秒）
        npMinGapSec: 20,     // 雰囲気の変化で確認する時、前回の確認からあける最低秒数
        npLoudLevel: 0.25,   // キックが聞こえなくても、低音の大きさがこれを超えていれば「音楽が鳴っている」とみなす
        npShowUnknown: true, // CADENCE に無い曲も、曲名・アーティスト名だけ表示するか

        // --- 調整パネルの「ビンゴへ」ボタンのリンク先 ---
        bingoUrl: 'https://gateofzen.github.io/bnk2025-bingo/host.html',

        // --- 動き始め ---
        startBpm: 125,       // BPMが確定する前（曲の始まり）に、最初のキックから使う仮のテンポ

        // --- タイミング補正 ---
        // マイク入力・画面・プロジェクターの遅れを打ち消すため、動きをこの分だけ先回りさせる（ミリ秒）
        // 会場で ＋/− ボタンで調整でき、値はこの端末に保存されます
        syncOffsetMs: 60,

        // --- BPM推定 ---
        bpmMin: 80,        // 推定するBPMの範囲（この範囲に倍・半分で折りたたむ）
        bpmMax: 180,
        bpmWindowMs: 8000, // 直近何ミリ秒分のキックからBPMを推定するか
        bpmMinKicks: 4,    // BPMを出すのに必要なキックの数
        bpmLostMs: 3000,   // キックがこの時間なければ「曲間」とみなして拡大を止める

        // --- キック検出 ---
        kickRatio: 0.5,    // 直近の最大キックに対してこの割合以上の「跳ね上がり」でキックとみなす
        kickMinGapMs: 180  // キック判定の最短間隔（ミリ秒）
    };

    // 背景の種類（調整パネルのボタンで切り替え。端末に保存）
    try {
        const savedBg = localStorage.getItem('fcv-bgType');
        if (savedBg === 'mirror' || savedBg === 'off') CFG.bgType = savedBg;
    } catch (e) {}

    // 補正値は端末に保存（会場で一度合わせれば次回も使える）
    try {
        const saved = localStorage.getItem('fcv-syncOffsetMs');
        if (saved !== null && !isNaN(+saved)) CFG.syncOffsetMs = +saved;
    } catch (e) {}

    // ===== 調整パネル（ダブルタップで表示/非表示） =====
    const syncPanel = document.getElementById('syncPanel');
    const bpmLabel = document.getElementById('bpmLabel');
    const offsetLabel = document.getElementById('offsetLabel');
    let panelVisible = false;
    function showOffset() { offsetLabel.textContent = `${CFG.syncOffsetMs}ms`; }
    function changeOffset(d) {
        CFG.syncOffsetMs = Math.max(-200, Math.min(400, CFG.syncOffsetMs + d));
        showOffset();
        try { localStorage.setItem('fcv-syncOffsetMs', String(CFG.syncOffsetMs)); } catch (e) {}
    }
    document.getElementById('offsetMinus').addEventListener('click', e => { e.stopPropagation(); changeOffset(-10); });
    document.getElementById('offsetPlus').addEventListener('click', e => { e.stopPropagation(); changeOffset(10); });
    syncPanel.addEventListener('dblclick', e => e.stopPropagation());
    // 曲名表示のON/OFF と APIキーの入力
    const npToggleBtn = document.getElementById('npToggle');
    function showNpState() {
        const on = (() => { try { return localStorage.getItem('fcv-npEnabled') !== '0'; } catch (e) { return true; } })();
        npToggleBtn.textContent = on ? '曲名:ON' : '曲名:OFF';
    }
    showNpState();
    npToggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        try {
            const on = localStorage.getItem('fcv-npEnabled') !== '0';
            localStorage.setItem('fcv-npEnabled', on ? '0' : '1');
        } catch (err) {}
        showNpState();
    });
    document.getElementById('npKey').addEventListener('click', e => {
        e.stopPropagation();
        const ask = (key, label, note) => {
            let cur = '';
            try { cur = localStorage.getItem(key) || ''; } catch (err) {}
            const v = prompt(label + (note ? '\n' + note : '') + '\n（このタブレットにだけ保存されます）', cur);
            if (v === null) return false;                       // キャンセル
            try { localStorage.setItem(key, v.trim()); } catch (err) {}
            return true;
        };
        if (CFG.npService === 'audd') {
            ask('fcv-auddToken', 'AudD の APIキー（api_token）');
            return;
        }
        // ACRCloud：コンソールのプロジェクト画面に表示される3つの値
        if (!ask('fcv-acrHost', '① ACRCloud の Host', '例: identify-ap-southeast-1.acrcloud.com')) return;
        if (!ask('fcv-acrKey', '② ACRCloud の Access Key')) return;
        if (!ask('fcv-acrSecret', '③ ACRCloud の Access Secret')) return;
        ask('fcv-acrProxy', '④ 中継用 Cloudflare Worker の URL（空欄のままで OK）',
            '「通信エラー」が出る時だけ、Worker の URL を入れてください');
    });

    // ビンゴのページへ移動（同じタブで開く。戻る操作でこの画面に戻れる）
    document.getElementById('bingoLink').addEventListener('click', e => {
        e.stopPropagation();
        location.href = CFG.bingoUrl;
    });
    const bgToggle = document.getElementById('bgToggle');
    const BG_NAMES = { mirror: '背景:ミラーボール', off: '背景:なし' };
    function showBgState() { bgToggle.textContent = BG_NAMES[CFG.bgType]; }
    showBgState();
    bgToggle.addEventListener('click', e => {
        e.stopPropagation();
        const order = ['mirror', 'off'];
        CFG.bgType = order[(order.indexOf(CFG.bgType) + 1) % order.length];
        showBgState();
        try { localStorage.setItem('fcv-bgType', CFG.bgType); } catch (err) {}
        if (spinAnim) createBackground();
    });
    document.addEventListener('dblclick', () => {
        panelVisible = !panelVisible;
        syncPanel.style.display = panelVisible ? 'flex' : 'none';
        showOffset();
    });

    // --- 自動仕分けプログラム ---
    function setupSVG() {
        const allPaths = Array.from(svgElement.querySelectorAll('path'));
        
        // ロゴ用グループ（強い発光）
        glowGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        svgElement.appendChild(glowGroup);

        logoPaths = [];

        allPaths.forEach(path => {
            const fillAttr = (path.getAttribute('fill') || '').toLowerCase();
            const dAttr = (path.getAttribute('d') || '').trim();
            const parentClass = path.parentElement ? path.parentElement.getAttribute('class') : '';

            // 1. 背景削除
            if (dAttr.startsWith('M 613') || dAttr.startsWith('M 0 0')) {
                path.style.display = 'none'; 
                return;
            }

            // 2. 光るパーツ（ロゴ）の判定
            if ((parentClass && parentClass.includes('reactive-paths')) || fillAttr === '#fbfffe') {
                glowGroup.appendChild(path);
                logoPaths.push(path);
                // 丸いロゴ本体（外周の円から始まるパス）を回転対象として記録
                if (dAttr.startsWith('M 309.94 60.97')) circleLogo = path;
                // 初期色：白
                path.style.fill = '#ffffff'; 
            } 
            // 3. 文字・その他（黒いパーツ）
            else {
                // ★重要: 「static-text」クラスを付けて、CSSで強制的に黒くする
                path.classList.add('static-text');
                // 背景の光を出す時は、黒い四角や（回転しない）黒いパーツが光を隠すので非表示に
                path.style.display = 'none';
                // 念のためJSでも黒に設定
                path.style.fill = '#000000';
                // 中抜き用属性を明示的にセット
                path.setAttribute('fill-rule', 'evenodd');
            }
        });

        // 背景の光を出す時は、元SVGの黒い四角い背景を消す（光を隠してしまうため）
        svgElement.querySelectorAll(':scope > rect').forEach(r => r.style.display = 'none');

        // 丸ロゴを、同じ座標系の別SVG（専用レイヤー）に移す
        if (circleLogo) {
            const vb = svgElement.getAttribute('viewBox');
            const mkSvg = () => {
                const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                el.setAttribute('viewBox', vb);
                return el;
            };
            spinLayer = document.createElement('div');  spinLayer.id = 'spinLayer';
            pulseLayer = document.createElement('div'); pulseLayer.id = 'pulseLayer';

            // 発光用レイヤー（丸ロゴの形をぼかしたもの。細い光と広い光の2枚）
            glowLayer = document.createElement('div');
            glowLayer.id = 'glowLayer';
            const makeGlow = (id, blur) => {
                const div = document.createElement('div');
                const g = mkSvg();
                g.innerHTML = `<defs><filter id="${id}" x="-40%" y="-40%" width="180%" height="180%">
                    <feGaussianBlur stdDeviation="${blur}"/></filter></defs>`;
                const shape = circleLogo.cloneNode(true);
                shape.style.fill = '#ff3333';           // 色は CSS の hue-rotate で回す
                shape.setAttribute('filter', `url(#${id})`);
                g.appendChild(shape);
                div.appendChild(g);
                glowLayer.appendChild(div);
                return div;
            };
            glowTight = makeGlow('glowBlurTight', 3);
            glowWide  = makeGlow('glowBlurWide', 16);
            glowTight.style.opacity = '0.8';
            glowWide.style.opacity = '0';

            logoLayer = document.createElement('div');
            logoLayer.id = 'logoLayer';
            const layerSvg = mkSvg();

            // 背景の光の粒がロゴの穴から透けないよう、円の内側を黒で塗る（ロゴ自体がミラーボールに見える）
            {
                const disc = document.createElementNS("http://www.w3.org/2000/svg", "path");
                disc.setAttribute('d', circleLogo.getAttribute('d').trim().split(/(?=M\s)/)[0]);
                disc.style.fill = '#000000';
                layerSvg.appendChild(disc);
            }

            // 幾何学模様のマス：丸ロゴのパスの「くり抜き部分」を1つずつ取り出し、
            // 色付きの図形としてロゴの線の下に敷く（ロゴと一緒に回転する）
            if (CFG.cellsEnabled) {
                const subpaths = circleLogo.getAttribute('d').trim().split(/(?=M\s)/);
                subpaths.slice(1).forEach(sp => {          // 先頭は外周の円なので除く
                    const isCenter = sp.trim().startsWith('M 210.36 240.90');
                    if (isCenter && !CFG.cellFillCenter) return;
                    const cell = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    cell.setAttribute('d', sp.trim());
                    cell.style.fill = '#000000';
                    cell.style.opacity = '0';
                    cell.style.fill = '#ffffff';
                    layerSvg.appendChild(cell);
                    cells.push(cell);
                });
            }
            layerSvg.appendChild(circleLogo);
            logoLayer.appendChild(layerSvg);

            pulseLayer.appendChild(glowLayer);
            pulseLayer.appendChild(logoLayer);
            spinLayer.appendChild(pulseLayer);
            visualizerContainer.appendChild(spinLayer);
        }
    }

    let wakeLock = null;
    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
    }
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
    });

    // ===== 回転・拡大アニメーション（ブラウザのアニメーション機能で動かす） =====
    // どちらも「1拍 = 1000」の時間単位で作り、再生速度 = 1000 / 1拍のミリ秒 にすると BPM に一致する
    let spinAnim = null, pulseAnim = null;
    const BEAT_UNIT = 1000;

    // ロゴの回転の速度を設定（「1拍 = 1000」の時間単位なので、BPM に一致する。床の光は独立してゆっくり回る）
    function setSpinRate(r) {
        spinAnim.playbackRate = r;
    }

    // ===================== 背景 =====================
    let mirrorAnim = null, mirrorRate = 0, mirrorRateShown = -1, lastMirrorAdjust = 0;
    let bgParts = [];        // 毎フレーム明るさを変える要素 { el, kind, shown }
    let bgFlash = 0, bgBeatCount = 0;

    // ロゴ（ミラーボール）の画面上の中心と半径
    function ballGeometry() {
        const rect = visualizerContainer.getBoundingClientRect();
        const k = rect.width / 613;
        return { cx: rect.left + 311.63 * k, cy: rect.top + rect.height / 2 + (240.88 - 306) * k, r: 179 * k };
    }
    function hslToRgb(h, s, l) {
        const f = n => {
            const k = (n + h / 30) % 12;
            return Math.round(255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
        };
        return [f(0), f(8), f(4)];
    }
    function spotColor(tint) {
        return Math.random() < tint ? hslToRgb(Math.random() * 360, 0.9, 0.8).join(',') : '255,255,255';
    }

    // ---------- ミラーボール：ロゴのマスの形の光を床に映す ----------
    let cellShapes = null;   // ロゴのマスの形 [{ d, path2d, cx, cy, bx, by, bw, bh, size }]
    function getCellShapes() {
        if (cellShapes) return cellShapes;
        const subs = circleLogo.getAttribute('d').trim().split(/(?=M\s)/).slice(1)
            .map(x => x.trim()).filter(x => !x.startsWith('M 210.36 240.90'));   // 外周と中央の八角形は除く
        const tmpSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        tmpSvg.style.position = 'absolute'; tmpSvg.style.visibility = 'hidden';
        document.body.appendChild(tmpSvg);
        cellShapes = subs.map(d => {
            const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
            el.setAttribute('d', d);
            tmpSvg.appendChild(el);
            const bb = el.getBBox();
            return { d, path2d: new Path2D(d), cx: bb.x + bb.width / 2, cy: bb.y + bb.height / 2,
                     bx: bb.x, by: bb.y, bw: bb.width, bh: bb.height, size: Math.max(bb.width, bb.height) };
        });
        tmpSvg.remove();
        return cellShapes;
    }

    // 床の上に、ロゴのマスの形の光をばらまいて描く
    function drawFloorSpots(ctx, R, count) {
        const shapes = getCellShapes();
        for (let i = 0; i < count; i++) {
            const r = R * (0.1 + 0.88 * Math.sqrt(Math.random()));   // 床の上に均等に（ミラーボールの真下は空ける）
            const th = Math.random() * Math.PI * 2;
            const sh = shapes[Math.floor(Math.random() * shapes.length)];
            const size = CFG.mbSpotSize[0] + Math.random() * (CFG.mbSpotSize[1] - CFG.mbSpotSize[0]);
            const k = size / sh.size;
            const color = spotColor(CFG.mbTint);
            ctx.save();
            ctx.translate(R + Math.cos(th) * r, R + Math.sin(th) * r);
            ctx.rotate(th + Math.PI / 2 + (Math.random() - 0.5) * 0.6);
            ctx.scale(k, k);
            ctx.translate(-sh.cx, -sh.cy);
            ctx.shadowColor = `rgba(${color},0.9)`;
            ctx.shadowBlur = 10;
            ctx.fillStyle = `rgba(${color},${(0.75 + Math.random() * 0.25).toFixed(2)})`;
            ctx.fill(sh.path2d, 'evenodd');
            ctx.restore();
        }
    }

    function buildMirror(bg, vw, vh) {
        const ball = ballGeometry();
        const P = 1600, tilt = CFG.mbFloorTilt;
        const fx = ball.cx, fy = vh * CFG.mbFloorY;
        // 床の半径：画面の四隅が床の上のどこに当たるかを逆算し、いちばん遠い隅まで届く大きさにする
        //   （ただし手前側がカメラ（視点）を越えない範囲・上限 mbFloorRadius まで）
        const tr = tilt * Math.PI / 180, ct = Math.cos(tr), st = Math.sin(tr);
        let need = 0;
        for (const [sx, sy] of [[0, 0], [vw, 0], [0, vh], [vw, vh]]) {
            const X = sx - fx, Y = sy - fy;                    // 画面上の位置（床の中心から）
            const Yf = Y * P / (P * ct + Y * st);               // 床の上での奥行き方向の位置
            const k = P / (P - Yf * st);                        // その位置での見かけの拡大率
            need = Math.max(need, Math.hypot(X / k, Yf));
        }
        const R = Math.round(Math.min(CFG.mbFloorRadius, 0.85 * P / st, need * 1.04));
        const floor = document.createElement('div');
        floor.className = 'floor';
        Object.assign(floor.style, { left: (fx - R) + 'px', top: (fy - R) + 'px', width: (2 * R) + 'px', height: (2 * R) + 'px',
                                     transform: `perspective(${P}px) rotateX(${tilt}deg)` });
        const move = document.createElement('div');
        move.className = 'bgMove';
        floor.appendChild(move);

        // 光（組ごとに1枚のキャンバスへ最初に1回だけ描く。メモリを抑えるため最大2048pxで描いて拡大表示）
        //   拍ごとに組を交互にフラッシュさせるので、光る場所が毎拍変わる
        const scale = Math.min(1, 2048 / (2 * R));
        const count = Math.round(CFG.mbSpots * (R / 900) * (R / 900));   // 床が広いほど数を増やして密度をそろえる
        for (let g = 0; g < Math.max(1, CFG.mbSets); g++) {
            const set = document.createElement('div');
            set.className = 'bgSet';
            const cv = document.createElement('canvas');
            cv.width = Math.round(2 * R * scale); cv.height = cv.width;
            cv.style.width = (2 * R) + 'px'; cv.style.height = (2 * R) + 'px';
            const ctx = cv.getContext('2d');
            ctx.scale(scale, scale);
            drawFloorSpots(ctx, R, count);
            set.appendChild(cv);
            move.appendChild(set);
            bgParts.push({ el: set, kind: 'mirrorMain', group: g, flash: 0, shown: -1 });
        }

        // 個別に瞬く光（ロゴのマスの形の小さなSVG。瞬きはGPU側のアニメーション）
        const tw = document.createElement('div');
        tw.style.position = 'absolute'; tw.style.inset = '0';
        const shapes = getCellShapes();
        for (let i = 0; i < CFG.mbTwinkleSpots; i++) {
            const sh = shapes[Math.floor(Math.random() * shapes.length)];
            const r = R * (0.1 + 0.88 * Math.sqrt(Math.random()));
            const th = Math.random() * Math.PI * 2;
            const size = (CFG.mbSpotSize[0] + Math.random() * (CFG.mbSpotSize[1] - CFG.mbSpotSize[0])) * 1.1;
            const k = size / sh.size;
            const w = sh.bw * k, h = sh.bh * k;
            const el = document.createElement('div');
            el.className = 'twk';
            Object.assign(el.style, {
                width: w + 'px', height: h + 'px',
                left: (R + Math.cos(th) * r - w / 2) + 'px', top: (R + Math.sin(th) * r - h / 2) + 'px',
                transform: `rotate(${th + Math.PI / 2}rad)`
            });
            const color = spotColor(CFG.mbTint);
            el.innerHTML = `<svg viewBox="${sh.bx} ${sh.by} ${sh.bw} ${sh.bh}"><path d="${sh.d}" fill="rgb(${color})" fill-rule="evenodd"/></svg>`;
            el.style.setProperty('--d', (0.35 + Math.random() * 1.1).toFixed(2) + 's');
            el.style.setProperty('--dl', (-Math.random() * 2).toFixed(2) + 's');
            tw.appendChild(el);
        }
        move.appendChild(tw);
        bgParts.push({ el: tw, kind: 'mirrorTwinkle', shown: -1 });
        bg.appendChild(floor);

        // ロゴの回転とは独立した、ゆっくりした回転（速さは音楽の有無で 0〜1 倍に変える）
        const dir = CFG.direction >= 0 ? 1 : -1;
        mirrorAnim = move.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${360 * dir}deg)` }],
            { duration: CFG.mbSecondsPerRev * 1000, iterations: Infinity, easing: 'linear' });
        mirrorAnim.playbackRate = mirrorRate;
        mirrorRateShown = mirrorRate;
    }

    function createBackground() {
        const old = document.getElementById('bgLayer');
        if (old) old.remove();
        if (mirrorAnim) mirrorAnim.cancel();
        bgParts = []; mirrorAnim = null;
        if (CFG.bgType === 'off') return;

        const vw = window.innerWidth, vh = window.innerHeight;
        const bg = document.createElement('div');
        bg.id = 'bgLayer';
        document.body.insertBefore(bg, document.body.firstChild);
        buildMirror(bg, vw, vh);
    }

    // 拍の頭で呼ばれる
    // ストロボ：ロゴ（ミラーボール）を中心に、白い光がパッと広がってすぐ消える
    let strobeEl = null;
    function strobeFlash(strength) {
        if (!CFG.strobeEnabled || strength <= 0) return;
        if (!strobeEl) {
            strobeEl = document.createElement('div');
            strobeEl.id = 'strobe';
            document.body.insertBefore(strobeEl, visualizerContainer);
        }
        const b = ballGeometry();
        strobeEl.style.background = `radial-gradient(circle at ${b.cx}px ${b.cy}px, rgba(255,255,255,0.95) 0%, ` +
            `rgba(255,255,255,0.35) ${Math.round(b.r * 1.6)}px, rgba(255,255,255,0.08) ${Math.round(b.r * 3.2)}px, rgba(255,255,255,0) 100%)`;
        if (strobeEl._a) strobeEl._a.cancel();
        strobeEl._a = strobeEl.animate([{ opacity: strength }, { opacity: 0 }],
            { duration: CFG.strobeMs, easing: 'cubic-bezier(0.1, 0.7, 0.3, 1)', fill: 'forwards' });
    }

    function bgOnBeat() {
        bgFlash = 1;
        bgBeatCount++;
        // 床の光：拍ごとに組を交互に、4拍に1回は全部まとめてフラッシュ
        const sets = bgParts.filter(p => p.kind === 'mirrorMain');
        sets.forEach((p, g) => {
            if (bgBeatCount % 4 === 1 || g === bgBeatCount % sets.length) p.flash = 1;
        });
        strobeFlash(bgBeatCount % 4 === 1 ? CFG.strobeBar : CFG.strobeBeat);
    }

    // 毎フレーム：明るさ・ミラーボールの回転速度の調整（必要な時だけ書き換える）
    function updateBackground(now, dt, music) {
        const decay = Math.exp(-dt / CFG.mbFlashDecay);
        bgFlash *= decay;
        if (!mirrorAnim) return;
        // 床の光の回転：音楽が始まったらすぐ（約0.3秒）、止まったらゆっくり（約1.5秒）止める
        const targetRate = music > 0.5 ? 1 : 0;
        mirrorRate += (targetRate - mirrorRate) * (1 - Math.exp(-dt / (targetRate > mirrorRate ? 0.1 : 0.5)));
        if (Math.abs(targetRate - mirrorRate) < 0.01) mirrorRate = targetRate;
        if (mirrorRate !== mirrorRateShown && (now - lastMirrorAdjust > 100 || mirrorRate === targetRate)) {
            lastMirrorAdjust = now;
            mirrorAnim.playbackRate = mirrorRate;
            mirrorRateShown = mirrorRate;
        }
        for (const p of bgParts) {
            if (p.kind === 'mirrorMain') {
                p.flash *= decay;
                const v = music * Math.min(1, CFG.mbBase + CFG.mbFlash * p.flash);
                if (Math.abs(v - p.shown) > 0.01) { p.el.style.opacity = v.toFixed(3); p.shown = v; }
            } else if (p.kind === 'mirrorTwinkle') {
                const on = music > 0.3 ? 1 : 0;
                if (on !== p.shown) { p.el.style.visibility = on ? 'visible' : 'hidden'; p.shown = on; }
            }
        }
    }

    // ===================== 今かかっている曲の表示（音楽認識 → CADENCE で照合） =====================
    // マイクの音を数秒録音して音楽認識サービス（AudD）に送り、返ってきた曲名・アーティスト名を
    // CADENCE のデータと照合して、曲名・アーティスト名・プログラム名を画面左上に表示する。
    //
    // 曲の切り替わりの見つけ方（DJミックスではBPMが変わらないので、BPMには頼らない）
    //   ① 曲の残り時間から予測：AudD が返す「曲のどの位置を聞いたか」と CADENCE の曲の長さから、
    //      曲が終わる頃を計算して、その少し後に確認する
    //   ② 音の雰囲気の変化：曲のキー（和音の成分）と音域のバランスを常に測り、大きく変わったらすぐ確認する
    //   ③ 定期確認：①②で捉えられない時のために、一定間隔でも確認する
    const np = {
        ctx: null, proc: null, capturing: false, chunks: [], capLen: 0,
        busy: false, nextDue: 0, lastMusic: false, lastLoud: 0,
        failStreak: 0, lastDoneAt: 0, reason: '',
        current: null,            // 表示中の曲 { key, title, artist, program }
        songs: null, index: null, progOrder: null, trackDur: null, dataError: '',
        el: null, statusEl: null, hideTimer: null, statusText: '',
        // 音の雰囲気（②）
        featAn: null, featBuf: null, featAt: 0, cur: null, ref: null, change: 0, changeSince: 0
    };
    function npToken() { try { return localStorage.getItem('fcv-auddToken') || ''; } catch (e) { return ''; } }
    function npEnabled() { try { return localStorage.getItem('fcv-npEnabled') !== '0'; } catch (e) { return true; } }
    function npStatus(text) { np.statusText = text; }

    // CADENCE のデータ（songs.json / programs.json / 照合エンジン matcher.js）を読み込む
    async function npLoadCadence() {
        try {
            const base = CFG.npCadenceBase.replace(/\/?$/, '/');
            await new Promise((resolve, reject) => {
                if (typeof matchOne === 'function') return resolve();
                const sc = document.createElement('script');
                sc.src = base + 'matcher.js';
                sc.onload = resolve; sc.onerror = () => reject(new Error('matcher.js'));
                document.head.appendChild(sc);
            });
            const [songs, programs] = await Promise.all([
                fetch(base + 'songs.json').then(r => { if (!r.ok) throw new Error('songs.json ' + r.status); return r.json(); }),
                fetch(base + 'programs.json').then(r => { if (!r.ok) throw new Error('programs.json ' + r.status); return r.json(); })
            ]);
            np.songs = songs;
            np.index = buildIndex(songs);
            // CADENCE のプログラム一覧はおおむね新しい順に並んでいる → 後ろほど古いとみなす
            np.progOrder = new Map(programs.map((p, i) => [p.id, i]));
            // 曲の長さ（プログラムID と曲順から引く）
            np.trackDur = new Map();
            for (const p of programs) for (const t of (p.tracks || [])) {
                const m = /^(\d+):(\d{2})$/.exec(t.duration || '');
                if (m) np.trackDur.set(p.id + '|' + t.no, (+m[1]) * 60 + (+m[2]));
            }
        } catch (e) {
            np.dataError = 'CADENCEのデータを読み込めません（' + e.message + '）';
            console.warn(np.dataError);
        }
    }

    // 1曲が複数のプログラムで使われている時は「最も古い」プログラムを選ぶ
    //   ・LUSTER（イベント用のコンピレーション）は、ほかにプログラムがあれば除く
    //   ・残りは CADENCE の一覧で最も後ろ（＝古い）にあるもの
    function npOldestProgram(programs) {
        if (!programs || !programs.length) return '';
        const regular = programs.filter(p => !/^LUSTER\b/i.test(p.name));
        const pool = regular.length ? regular : programs;
        const order = p => (np.progOrder && np.progOrder.has(p.id)) ? np.progOrder.get(p.id) : -1;
        return pool.slice().sort((a, b) => order(b) - order(a))[0].name;
    }
    // 曲の長さ（秒）。見つからなければ null
    function npSongDuration(programs) {
        if (!np.trackDur) return null;
        for (const p of programs || []) {
            const d = np.trackDur.get(p.id + '|' + p.no);
            if (d) return d;
        }
        return null;
    }

    // マイクの音を取り込む準備（録音中だけ音を貯める）＋音の雰囲気を測る解析器
    function npInit(audioContext, source) {
        np.ctx = audioContext;
        const proc = audioContext.createScriptProcessor(4096, 1, 1);
        proc.onaudioprocess = e => {
            if (!np.capturing) return;
            const d = e.inputBuffer.getChannelData(0);
            np.chunks.push(new Float32Array(d));
            np.capLen += d.length;
        };
        const mute = audioContext.createGain();
        mute.gain.value = 0;                 // スピーカーには出さない
        source.connect(proc);
        proc.connect(mute);
        mute.connect(audioContext.destination);
        np.proc = proc;

        const an = audioContext.createAnalyser();
        an.fftSize = 8192;                   // 音の高さを細かく見分けるため大きめ
        an.smoothingTimeConstant = 0;
        source.connect(an);
        np.featAn = an;
        np.featBuf = new Float32Array(an.frequencyBinCount);
        npLoadCadence();
    }

    // 今の音の特徴：12音（ド〜シ）の成分の割合＋6つの音域の割合
    function npFeature() {
        const an = np.featAn, buf = np.featBuf;
        an.getFloatFrequencyData(buf);
        const binHz = np.ctx.sampleRate / an.fftSize;
        const chroma = new Float32Array(12), bands = new Float32Array(6);
        const edges = [40, 120, 300, 800, 2000, 5000, 12000];
        let total = 0;
        for (let i = 1; i < buf.length; i++) {
            const f = i * binHz;
            if (f < 40 || f > 12000) continue;
            const pw = Math.pow(10, buf[i] / 10);
            total += pw;
            for (let b = 0; b < 6; b++) if (f >= edges[b] && f < edges[b + 1]) { bands[b] += pw; break; }
            if (f >= 100 && f <= 2500) {
                const pc = ((Math.round(12 * Math.log2(f / 440)) % 12) + 12) % 12;
                chroma[pc] += pw;
            }
        }
        if (total <= 0) return null;
        const norm = v => { let s = 0; for (const x of v) s += x * x; s = Math.sqrt(s) || 1; return Array.from(v, x => x / s); };
        // 大きい成分ばかりに引っぱられないよう平方根で圧縮してから正規化
        return { chroma: norm(chroma.map(Math.sqrt)), bands: norm(bands.map(Math.sqrt)) };
    }
    function npBlend(a, b, k) {
        if (!a) return { chroma: b.chroma.slice(), bands: b.bands.slice() };
        return { chroma: a.chroma.map((x, i) => x + (b.chroma[i] - x) * k), bands: a.bands.map((x, i) => x + (b.bands[i] - x) * k) };
    }
    function npDistance(a, b) {
        const cos = (u, v) => { let d = 0, nu = 0, nv = 0; for (let i = 0; i < u.length; i++) { d += u[i] * v[i]; nu += u[i] * u[i]; nv += v[i] * v[i]; } return d / (Math.sqrt(nu * nv) || 1); };
        // キーの違いを重視（音域のバランスは曲の中でも変わりやすいので軽め）
        return 0.75 * (1 - cos(a.chroma, b.chroma)) + 0.25 * (1 - cos(a.bands, b.bands));
    }
    // 200msごとに特徴を測り、「今の雰囲気（約6秒の平均）」と「この曲の雰囲気（ゆっくり追従）」を比べる
    function npTrackChange(now, music) {
        if (!np.featAn || now - np.featAt < 200) return;
        const dt = (now - np.featAt) / 1000;
        np.featAt = now;
        if (!music) return;
        const f = npFeature();
        if (!f) return;
        np.cur = npBlend(np.cur, f, 1 - Math.exp(-dt / CFG.npChangeWindow));
        if (!np.ref) { np.ref = npBlend(null, np.cur, 1); return; }
        np.change = npDistance(np.cur, np.ref);
        np.ref = npBlend(np.ref, np.cur, 1 - Math.exp(-dt / CFG.npRefWindow));   // 曲の中の展開にはゆっくり追従
        if (np.change > CFG.npChangeThreshold) {
            if (!np.changeSince) np.changeSince = now;
        } else {
            np.changeSince = 0;
        }
    }

    // 貯めた音を 16kHz・モノラルの WAV にする
    function npMakeWav() {
        const sr = np.ctx.sampleRate, target = 16000;
        const all = new Float32Array(np.capLen);
        let o = 0;
        for (const c of np.chunks) { all.set(c, o); o += c.length; }
        const ratio = sr / target, n = Math.floor(all.length / ratio);
        const pcm = new Int16Array(n);
        for (let i = 0; i < n; i++) {
            const a = Math.floor(i * ratio), b = Math.min(all.length, Math.floor((i + 1) * ratio));
            let s = 0;
            for (let j = a; j < b; j++) s += all[j];
            const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
            pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
        }
        const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
        const w = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE');
        w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
        dv.setUint32(24, target, true); dv.setUint32(28, target * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
        w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
        new Int16Array(buf, 44).set(pcm);
        return new Blob([buf], { type: 'audio/wav' });
    }

    function npCapture(seconds) {
        return new Promise(resolve => {
            np.chunks = []; np.capLen = 0; np.capturing = true;
            setTimeout(() => { np.capturing = false; resolve(npMakeWav()); }, seconds * 1000);
        });
    }

    function npLs(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
    // 認識に必要な設定がそろっているか
    function npReady() {
        if (CFG.npService === 'audd') return !!npLs('fcv-auddToken');
        return !!(npLs('fcv-acrHost') && npLs('fcv-acrKey') && npLs('fcv-acrSecret'));
    }

    // 通信が返ってこない時に止まったままにならないよう、一定時間で打ち切る
    async function npPost(url, body) {
        const ac = new AbortController();
        const timer = setTimeout(() => ac.abort(), CFG.npTimeoutSec * 1000);
        try {
            const res = await fetch(url, { method: 'POST', body, signal: ac.signal });
            return await res.json();
        } finally { clearTimeout(timer); }
    }

    // AudD に問い合わせる
    async function npAskAudd(wav) {
        const fd = new FormData();
        fd.append('file', wav, 'clip.wav');
        fd.append('api_token', npLs('fcv-auddToken'));
        const json = await npPost(CFG.npApiUrl, fd);
        if (json.status !== 'success') return { ok: false, why: (json.error && json.error.error_message) || 'エラー' };
        if (!json.result) return { ok: false, why: '該当なし' };
        const tc = /^(?:(\d+):)?(\d+):(\d{2})$/.exec(json.result.timecode || '');
        // AudD の timecode は「録音の始まり」が曲のどこだったか
        return { ok: true, title: json.result.title || '', artist: json.result.artist || '',
                 pos: tc ? (+(tc[1] || 0)) * 3600 + (+tc[2]) * 60 + (+tc[3]) : null, posAt: 'start', dur: null };
    }

    // ACRCloud に問い合わせる（署名：HMAC-SHA1 → Base64）
    async function npAskAcr(wav) {
        const host = npLs('fcv-acrHost').replace(/^https?:\/\//, '').replace(/\/.*$/, '');
        const key = npLs('fcv-acrKey'), secret = npLs('fcv-acrSecret');
        const timestamp = String(Math.floor(Date.now() / 1000));
        const toSign = ['POST', '/v1/identify', key, 'audio', '1', timestamp].join('\n');
        const enc = new TextEncoder();
        const k = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
        const sig = new Uint8Array(await crypto.subtle.sign('HMAC', k, enc.encode(toSign)));
        let bin = '';
        for (const b of sig) bin += String.fromCharCode(b);
        const fd = new FormData();
        fd.append('sample', wav, 'clip.wav');
        fd.append('sample_bytes', String(wav.size));
        fd.append('access_key', key);
        fd.append('data_type', 'audio');
        fd.append('signature_version', '1');
        fd.append('signature', btoa(bin));
        fd.append('timestamp', timestamp);
        const proxy = npLs('fcv-acrProxy');
        const url = proxy ? proxy.replace(/\/?$/, '/') + '?host=' + encodeURIComponent(host) : 'https://' + host + '/v1/identify';
        const json = await npPost(url, fd);
        const code = json.status ? json.status.code : -1;
        if (code === 1001) return { ok: false, why: '該当なし' };
        if (code !== 0) return { ok: false, why: (json.status && json.status.msg) || 'エラー' };
        const m = json.metadata && json.metadata.music && json.metadata.music[0];
        if (!m) return { ok: false, why: '該当なし' };
        // ACRCloud の play_offset_ms は「認識した時点（録音の終わり頃）」が曲のどこだったか
        return { ok: true, title: m.title || '', artist: (m.artists || []).map(a => a.name).join(' & '),
                 pos: m.play_offset_ms != null ? +m.play_offset_ms / 1000 : null, posAt: 'end',
                 dur: m.duration_ms ? +m.duration_ms / 1000 : null };
    }

    async function npRecognize() {
        np.busy = true;
        try {
            npStatus('聞き取り中…');
            const clipStart = performance.now();
            const wav = await npCapture(CFG.npClipSec);
            const clipEnd = performance.now();
            npStatus('認識中…');
            const r = CFG.npService === 'audd' ? await npAskAudd(wav) : await npAskAcr(wav);
            r.clipStart = clipStart; r.clipEnd = clipEnd;
            return r;
        } catch (e) {
            console.warn(e);
            return { ok: false, why: e.name === 'AbortError' ? '応答なし' : '通信エラー' };
        } finally {
            np.busy = false;
        }
    }

    // 認識結果を CADENCE と照合して表示する。曲の長さが分かれば返す
    function npShow(r) {
        let title = r.title, artist = r.artist, program = '', key = (r.title + '|' + r.artist).toLowerCase(), dur = null;
        if (np.index) {
            const m = matchOne({ title: r.title, artist: r.artist, swappable: false }, np.index);
            if (m.match !== 'none' && m.song) {
                title = m.song.titleEn || m.song.title;
                artist = m.song.artistEn || m.song.artist;
                program = npOldestProgram(m.programs);
                key = m.song.key;
                dur = npSongDuration(m.programs);
            }
        }
        if (!program && !CFG.npShowUnknown) return { key, dur, shown: false };
        if (np.current && np.current.key === key) return { key, dur, shown: true, same: true };   // 同じ曲なら表示はそのまま
        const hadText = np.el.textContent.trim() !== '';
        np.current = { key, title, artist, program };
        const el = np.el;
        el.style.opacity = '0';
        setTimeout(() => {
            el.querySelector('.np-title').textContent = title;
            el.querySelector('.np-artist').textContent = artist;
            el.querySelector('.np-program').textContent = program;
            el.style.opacity = '1';
        }, hadText ? 600 : 0);
        return { key, dur, shown: true, same: false, title, program };
    }

    // 毎フレーム：いつ認識するかを決める
    function npUpdate(now, loud) {
        if (!np.ctx || !np.el) return;
        // 音楽が鳴っているか：キックが聞こえている、または一定以上の音量がある
        if (loud > CFG.npLoudLevel) np.lastLoud = now;
        const music = (lastKick > 0 && now - lastKick < 3000) || (np.lastLoud > 0 && now - np.lastLoud < 3000);
        npTrackChange(now, music);
        if (np.statusEl && panelVisible) {
            const wait = (!np.busy && np.nextDue > now && np.nextDue - now < 1e8) ? `（${Math.ceil((np.nextDue - now) / 1000)}秒後に確認）` : '';
            const chg = np.ref ? `｜変化${np.change.toFixed(2)}` : '';
            const text = '曲名: ' + np.statusText + wait + chg;
            if (np.statusEl.textContent !== text) np.statusEl.textContent = text;
        }
        if (!npEnabled()) {
            if (np.el.style.opacity !== '0') np.el.style.opacity = '0';
            return;
        }
        if (!music) {
            // 音楽が止まったら少し待って表示を消す（曲間で消えすぎないよう 8 秒）
            if (np.lastMusic) {
                np.lastMusic = false;
                clearTimeout(np.hideTimer);
                np.hideTimer = setTimeout(() => { np.el.style.opacity = '0'; np.current = null; }, 8000);
            }
            return;
        }
        if (!np.lastMusic) {
            // 音楽が始まった：数秒後に認識
            np.lastMusic = true;
            clearTimeout(np.hideTimer);
            np.nextDue = Math.min(Math.max(np.nextDue, now), now + CFG.npStartDelaySec * 1000);
            if (!np.current) np.nextDue = now + CFG.npStartDelaySec * 1000;
        }
        // ② 音の雰囲気が大きく変わった状態が続いた → 新しい曲の可能性が高いので、すぐ確認
        if (np.changeSince && now - np.changeSince > CFG.npChangeHoldSec * 1000 &&
            now - np.lastDoneAt > CFG.npMinGapSec * 1000 && !np.busy && np.nextDue > now) {
            np.nextDue = now;
            np.reason = '雰囲気が変化';
        }
        if (np.busy || now < np.nextDue) return;
        if (!npReady()) { npStatus('APIキー未設定'); np.nextDue = now + 5000; return; }
        np.nextDue = now + 1e9;   // 認識が終わるまで次は入れない
        npRecognize().then(r => {
            const t = performance.now();
            np.lastDoneAt = t;
            if (r.ok) {
                np.failStreak = 0;
                const s = npShow(r);
                npStatus(s.shown ? (s.same ? '同じ曲' : '新しい曲') + '：' + (np.current ? np.current.title : r.title)
                                 : 'CADENCEに無い曲');
                // ③ 定期確認
                let next = t + CFG.npIntervalSec * 1000;
                // ① 曲の残り時間から、次の曲に替わった頃に確認
                const dur = r.dur || s.dur;
                if (dur && r.pos !== null) {
                    const ref = r.posAt === 'end' ? r.clipEnd : r.clipStart;
                    const endAt = ref + (dur - r.pos) * 1000;
                    const atEnd = endAt + CFG.npAfterEndSec * 1000;
                    if (atEnd > t + 5000) next = Math.min(next, atEnd);
                }
                np.nextDue = next;
                // この曲の雰囲気を基準にし直す
                if (np.cur) np.ref = npBlend(null, np.cur, 1);
                np.changeSince = 0;
            } else {
                np.failStreak++;
                // 認識できなかった：すぐやり直す（続けて失敗したら少し間を空ける）
                const wait = np.failStreak >= 3 ? CFG.npRetrySec * 3 : CFG.npRetrySec;
                npStatus(r.why + ' → 再挑戦');
                np.nextDue = t + wait * 1000;
            }
        });
    }

    function createAnimations() {
        const beatsPerRev = 360 / CFG.degPerBeat;
        const turn = 360 * (CFG.direction >= 0 ? 1 : -1);
        spinAnim = spinLayer.animate(
            [{ transform: 'rotate(0deg)' }, { transform: `rotate(${turn}deg)` }],
            { duration: BEAT_UNIT * beatsPerRev, iterations: Infinity, easing: 'linear' });

        // 拡大：拍の頭（0%）でピーク → なめらかに戻る → 次の拍の少し前から膨らむ
        if (!CFG.pulseEnabled) { setIdle(); return; }
        const n = Math.max(1, CFG.pulseEvery);
        const S = `scale(${1 + CFG.pulseScale})`;
        const fall = Math.min(0.95, CFG.pulseFall / n);
        const riseStart = Math.max(fall + 0.01, 1 - CFG.pulseRise / n);
        pulseAnim = pulseLayer.animate([
            { offset: 0,         transform: S,          easing: 'cubic-bezier(0.25, 0.6, 0.35, 1)' }, // 戻り（最初速く→ゆっくり）
            { offset: fall,      transform: 'scale(1)' },
            { offset: riseStart, transform: 'scale(1)', easing: 'cubic-bezier(0.55, 0, 0.85, 0.5)' },  // 膨らみ（加速しながら）
            { offset: 1,         transform: S }
        ], { duration: BEAT_UNIT * n, iterations: Infinity, easing: 'linear' });

        setIdle();
    }

    // BPM不明（無音・曲間）：ゆっくり回転、拡大はお休み
    let pulseRunning = false;
    let spinActive = false;   // BPMに合わせて回転中か
    function setIdle() {
        const beatsPerRev = 360 / CFG.degPerBeat;
        setSpinRate(CFG.idleSpeed > 0 ? beatsPerRev * CFG.idleSpeed / 360 : 0);
        // 拡大は「元の大きさ」の位置で止めておく
        if (pulseAnim) {
            pulseAnim.pause();
            pulseAnim.currentTime = BEAT_UNIT * Math.max(1, CFG.pulseEvery) * 0.7;
        }
        pulseRunning = false;
        spinActive = false;
    }

    // ===== 拍の時計 =====
    // キックの時刻から BPM（拍の長さ）と「拍の頭がいつ来るか」を推定し続ける
    let bpm = null;          // 推定BPM
    let beatRef = null;      // 拍の頭の基準時刻（ms, performance.now 基準）
    let kickTimes = [];
    let lastKick = 0;

    // ===== マス：ミラーボール風の光 =====
    // 各マスの「明るさ」を毎フレーム計算して、変化があった時だけ反映する
    //   ① 拍の頭：数か所が鋭くキラッと光る
    //   ② 拍の間：あちこちで小さな瞬き（音が大きいほど多い）
    //   ③ 固定の光源：回転するマスが光源の方向を通過すると光が流れる
    const cells = [];
    let cellState = null;          // [{ angle, flash, decay, color, shown, shownColor }]
    let musicLevel = 0;            // 0〜1：音楽が鳴っているか（なめらかに変化）
    let lastCellPhase = null, lastCellTrigger = 0;

    function initCells() {
        cellState = cells.map(c => {
            const bb = c.getBBox();
            const cx = bb.x + bb.width / 2 - 311.63, cy = bb.y + bb.height / 2 - 240.88;
            return { angle: Math.atan2(cy, cx) * 180 / Math.PI, flash: 0, decay: 0.1,
                     color: '#ffffff', shown: -1, shownColor: '' };
        });
    }

    // ミラーボールの光の色：ほとんど白、ときどき淡い色
    function ballColor() {
        if (Math.random() >= CFG.ballTint) {
            return Math.random() < 0.5 ? '#ffffff' : '#eef3ff';       // 白・青みがかった白（シルバー）
        }
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 90%, ${78 + Math.floor(Math.random() * 10)}%)`; // 淡い色
    }

    function flashCell(i, strength, decay) {
        const st = cellState[i];
        if (strength < st.flash) return;          // より明るく光っている最中なら上書きしない
        st.flash = strength;
        st.decay = decay;
        st.color = ballColor();
    }

    function beatFlash(loud) {
        bgOnBeat();
        const n = Math.round(CFG.beatFlashMin + (CFG.beatFlashMax - CFG.beatFlashMin) * Math.min(1, loud * 1.5));
        if (!cells.length) return;
        for (let k = 0; k < n; k++) flashCell(Math.floor(Math.random() * cells.length), 1, CFG.beatFlashDecay);
    }

    // スピン（回転レイヤー）の現在の角度
    function currentSpinAngle() {
        if (!spinAnim) return 0;
        const dur = BEAT_UNIT * 360 / CFG.degPerBeat;
        const t = ((spinAnim.currentTime % dur) + dur) % dur;
        return t / dur * 360 * (CFG.direction >= 0 ? 1 : -1);
    }

    function updateCells(now, dt, loud) {
        if (!cellState) initCells();

        // 音楽が鳴っているか：BPMが取れている、または直近にキックがある
        const musicOn = (bpm !== null) || (now - lastKick < 1500 && lastKick > 0);
        musicLevel += ((musicOn ? 1 : 0) - musicLevel) * (1 - Math.exp(-dt / (musicOn ? 0.06 : 0.8)));

        if (musicOn) {
            // ① 拍の頭でキラッ
            if (bpm !== null && beatRef !== null) {
                const P = 60000 / bpm;
                const x = (now + CFG.syncOffsetMs - beatRef) / P;
                const frac = x - Math.floor(x);
                if (lastCellPhase !== null && frac < lastCellPhase && now - lastCellTrigger > P * 0.5) {
                    beatFlash(loud);
                    lastCellTrigger = now;
                }
                lastCellPhase = frac;
            } else {
                lastCellPhase = null;
                if (lastKick > lastCellTrigger) { beatFlash(loud); lastCellTrigger = now; } // BPM確定前はキックに合わせる
            }
            // ② ランダムな瞬き
            const p = CFG.sparkleRate * (0.2 + 0.8 * Math.min(1, loud * 1.5)) * dt;
            for (let i = 0; i < cells.length; i++) {
                if (Math.random() < p) flashCell(i, 0.55 + Math.random() * 0.35, CFG.sparkleDecay);
            }
        } else {
            lastCellPhase = null;
        }

        // ③ 固定の光源の前を通るマスが光る
        const spin = currentSpinAngle();
        const glintAmp = CFG.glintStrength * musicLevel * (0.5 + 0.5 * Math.min(1, loud * 1.5));

        for (let i = 0; i < cells.length; i++) {
            const st = cellState[i];
            st.flash *= Math.exp(-dt / st.decay);
            let glint = 0;
            if (glintAmp > 0.01) {
                const a = st.angle + spin;
                for (const L of CFG.glintLights) {
                    let d = ((a - L) % 360 + 540) % 360 - 180;   // -180〜180
                    glint = Math.max(glint, Math.exp(-(d * d) / (2 * CFG.glintWidth * CFG.glintWidth)));
                }
                glint *= glintAmp;
            }
            const base = CFG.facetBase * musicLevel;
            const v = Math.max(base, glint, st.flash);
            const color = st.flash >= glint ? st.color : '#ffffff';
            // 変化があった時だけ書き換える（描画の負担を減らす）
            if (Math.abs(v - st.shown) > 0.01) { cells[i].style.opacity = v.toFixed(3); st.shown = v; }
            if (color !== st.shownColor && v > 0.02) { cells[i].style.fill = color; st.shownColor = color; }
        }
        updateBackground(now, dt, musicLevel);
    }

    function estimateBpm(now) {
        kickTimes = kickTimes.filter(t => now - t < CFG.bpmWindowMs);
        if (kickTimes.length < CFG.bpmMinKicks) return;
        // キック同士の「あらゆる組み合わせ」の間隔が、どの拍の長さの整数倍に一番よく乗るかを採点
        const intervals = [];
        for (let i = 0; i < kickTimes.length; i++) {
            for (let j = i + 1; j < kickTimes.length; j++) {
                const d = kickTimes[j] - kickTimes[i];
                if (d > 2500) break;
                if (d >= 150) intervals.push(d);
            }
        }
        const minT = 60000 / CFG.bpmMax, maxT = 60000 / CFG.bpmMin;
        const sigma = 12;
        let bestT = 0, bestScore = 0;
        const scores = [];
        for (let T = minT; T <= maxT; T += 1) {
            let sc = 0;
            for (const d of intervals) {
                const k = Math.round(d / T);
                if (k < 1) continue;
                const e = d - k * T;
                sc += Math.exp(-(e * e) / (2 * sigma * sigma)) / k;
            }
            scores.push(sc);
            if (sc > bestScore) { bestScore = sc; bestT = T; }
        }
        if (bestScore < 2) return;
        const idx = Math.round(bestT - minT);
        if (idx > 0 && idx < scores.length - 1) {
            const y0 = scores[idx - 1], y1 = scores[idx], y2 = scores[idx + 1];
            const den = y0 - 2 * y1 + y2;
            if (den < 0) bestT += 0.5 * (y0 - y2) / den;
        }
        const est = 60000 / bestT;
        if (bpm === null || Math.abs(est - bpm) > 15) {
            bpm = est;           // 曲が変わった → 即切り替え
        } else {
            bpm += (est - bpm) * 0.2;
        }
    }

    // 拍の頭の位置（位相）を決める
    //   直近のキックを「強さ」で重み付けして、拍の長さで割った余り（拍の中のどこで鳴ったか）を平均する。
    //   キックはベース等より強く出るので、裏拍の音が混じっても拍の頭はキックに合う。
    let kickEvents = [];     // { t: 時刻, w: 強さ }
    function updatePhase(now) {
        kickEvents = kickEvents.filter(k => now - k.t < CFG.bpmWindowMs);
        if (bpm === null || kickEvents.length < 3) return;
        const P = 60000 / bpm;
        let x = 0, y = 0;
        for (const k of kickEvents) {
            const ph = 2 * Math.PI * (k.t % P) / P;
            const w = Math.pow(k.w, 4) * Math.exp(-(now - k.t) / 4000); // 強いキック・新しいキックほど重視
            x += w * Math.cos(ph);
            y += w * Math.sin(ph);
        }
        if (x === 0 && y === 0) return;
        const phase = Math.atan2(y, x) / (2 * Math.PI) * P;   // 拍の頭の「余り」（ms）
        beatRef = phase + Math.round((now - phase) / P) * P;  // 直近の拍の頭の時刻
    }

    // 毎フレーム：アニメーションの速度・再生位置を拍の時計に合わせる（必要な時だけ操作する）
    let lastAdjust = 0, lastSpinAdjust = 0;
    function steerAnimations(now) {
        if (!spinAnim) return;
        const hasBpm = bpm !== null && beatRef !== null;
        const kicking = lastKick > 0 && now - lastKick < 1500;   // 直近にキックがある（曲が鳴っている）
        if (!hasBpm && pulseRunning && pulseAnim) {
            pulseAnim.pause();
            pulseAnim.currentTime = BEAT_UNIT * Math.max(1, CFG.pulseEvery) * 0.7;
            pulseRunning = false;
        }
        // 目標の回転速度：BPMが取れていればそのBPM / 取れていなくてもキックがあれば仮のテンポで即スタート / 無音なら停止
        const beatsPerRev = 360 / CFG.degPerBeat;
        const idleRate = CFG.idleSpeed > 0 ? beatsPerRev * CFG.idleSpeed / 360 : 0;
        const target = hasBpm ? BEAT_UNIT / (60000 / bpm)
                     : kicking ? BEAT_UNIT / (60000 / CFG.startBpm)
                     : idleRate;
        if (now - lastSpinAdjust > 80) {
            lastSpinAdjust = now;
            const cur = spinAnim.playbackRate;
            const diff = target - cur;
            if (Math.abs(diff) > Math.max(target, cur) * 0.01 + 1e-4) {
                let next;
                if (target > cur) next = cur + diff * 0.6;            // 加速：約0.3秒で目標へ
                else if (target > 0) next = cur + diff * 0.5;         // テンポの修正
                else next = cur * 0.8;                                // 停止：約1.5秒かけて減速
                if (Math.abs(target - next) < Math.max(target, 0.05) * 0.03) next = target;
                setSpinRate(next);
            }
        }
        spinActive = hasBpm || kicking;
        if (!hasBpm) return;
        const P = 60000 / bpm;
        const baseRate = BEAT_UNIT / P;

        if (!CFG.pulseEnabled || !pulseAnim) return;

        // --- 拡大：拍の頭でピーク（補正分だけ先回りして表示） ---
        const n = Math.max(1, CFG.pulseEvery);
        const beatsNow = (now + CFG.syncOffsetMs - beatRef) / P;
        const cycle = BEAT_UNIT * n;
        const want = (((beatsNow % n) + n) % n) * BEAT_UNIT;   // 目標の再生位置

        if (!pulseRunning) {
            pulseAnim.currentTime = want;
            pulseAnim.playbackRate = baseRate;
            pulseAnim.play();
            pulseRunning = true;
            lastAdjust = now;
        } else if (now - lastAdjust > 150) {
            lastAdjust = now;
            const cur = pulseAnim.currentTime % cycle;
            let err = want - cur;
            if (err > cycle / 2) err -= cycle;
            if (err < -cycle / 2) err += cycle;
            if (Math.abs(err) > BEAT_UNIT * 0.15) {
                pulseAnim.currentTime = want;             // 大きくずれた（曲が変わった等）→ 合わせ直す
                pulseAnim.playbackRate = baseRate;
            } else {
                const rate = baseRate + Math.max(-0.08, Math.min(0.08, err / 600));
                if (Math.abs(rate - pulseAnim.playbackRate) > baseRate * 0.004) pulseAnim.playbackRate = rate;
            }
        }
    }

    async function startAudio() {
        setupSVG(); 

        if (logoPaths.length === 0) {
            alert('ロゴパーツが見つかりません。SVGを貼り付けてください。');
            return;
        }
        if (circleLogo) createAnimations();
        if (circleLogo) createBackground();
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(createBackground, 300);
        });

        try {
            await requestWakeLock();
            // エコーキャンセル・ノイズ抑制は処理遅延があり、音楽を削ってしまうことがあるのでOFF
            const stream = await navigator.mediaDevices.getUserMedia({ audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true,
                latency: 0
            } });
            const audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            const analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 1024;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const source = audioContext.createMediaStreamSource(stream);
            np.el = document.getElementById('nowPlaying');
            np.statusEl = document.getElementById('npStatus');
            npInit(audioContext, source);
            source.connect(analyser);

            // キック検出用：低音（〜150Hz）だけ取り出し、振幅が「急に跳ね上がった瞬間」をキックとする
            const kickFilter = audioContext.createBiquadFilter();
            kickFilter.type = 'lowpass';
            kickFilter.frequency.value = 150;
            const levelAnalyser = audioContext.createAnalyser();
            levelAnalyser.fftSize = 512;   // 約10msぶん
            const levelData = new Float32Array(levelAnalyser.fftSize);
            source.connect(kickFilter);
            kickFilter.connect(levelAnalyser);
            let levelSlow = 0, transMax = 0.02, kickArmed = true;
            let lastTime = performance.now();

            function detectKick(now, dt) {
                levelAnalyser.getFloatTimeDomainData(levelData);
                let level = 0;
                for (let i = 0; i < levelData.length; i++) {
                    const v = Math.abs(levelData[i]);
                    if (v > level) level = v;
                }
                const transient = Math.max(0, level - levelSlow);
                levelSlow += (level - levelSlow) * (1 - Math.exp(-dt / 0.2));
                transMax = Math.max(transient, 0.02, transMax * Math.exp(-dt / 8));
                const ratio = transient / transMax;

                if (kickArmed && ratio > CFG.kickRatio && now - lastKick > CFG.kickMinGapMs) {
                    kickArmed = false;
                    lastKick = now;
                    kickTimes.push(now);
                    kickEvents.push({ t: now, w: Math.min(1, ratio) });
                    estimateBpm(now);
                    updatePhase(now);
                }
                if (ratio < CFG.kickRatio * 0.5) kickArmed = true;

                // キックが途切れた → 曲間とみなす
                if (bpm !== null && now - lastKick > CFG.bpmLostMs) {
                    bpm = null; beatRef = null; kickTimes = []; kickEvents = [];
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                const now = performance.now();
                const dt = Math.min((now - lastTime) / 1000, 0.1);
                lastTime = now;

                analyser.getByteFrequencyData(dataArray);
                let bassTotal = 0;
                for(let i = 0; i < 8; i++) bassTotal += dataArray[i];
                const normalizedBass = bassTotal / 8 / 255;

                // 1. キック検出 → 拍の時計 → 回転・拡大アニメーションの速度と位置を合わせる
                detectKick(now, dt);
                steerAnimations(now);
                updateCells(now, dt, normalizedBass);
                npUpdate(now, normalizedBass);
                if (panelVisible) bpmLabel.textContent = bpm ? `BPM ${Math.round(bpm)}` : 'BPM --';

                // 2. 発光
                const glowIntensity = 5 + (Math.pow(normalizedBass, 2) * 50); 
                const baseHue = (Date.now() / 50) % 360;
                const glowSat = normalizedBass * 100;
                if (glowGroup) {
                    glowGroup.style.filter = `drop-shadow(0 0 ${glowIntensity.toFixed(1)}px hsla(${baseHue.toFixed(0)}, ${glowSat.toFixed(0)}%, 60%, 0.8))`;
                }
                if (glowLayer) {
                    glowLayer.style.filter =
                        `hue-rotate(${baseHue.toFixed(0)}deg) saturate(${normalizedBass.toFixed(2)}) brightness(${(1.7 - 0.7 * normalizedBass).toFixed(2)})`;
                    glowWide.style.opacity = Math.pow(normalizedBass, 2).toFixed(3);
                }

                // 3. ロゴの色変化（全色対応・白ベース）
                logoPaths.forEach((path, index) => {
                    const ratio = index / logoPaths.length; 
                    const dataIndex = Math.floor(ratio * (bufferLength * 0.6)); 
                    
                    let val = dataArray[dataIndex] * 4.0;
                    if (val > 255) val = 255;
                    const normalizedVal = val / 255; 

                    // 色相: 全範囲（0〜360）で循環
                    const hue = (ratio * 360) + (Date.now() / 100); 

                    // 彩度: 音量連動（小さいと白、大きいと鮮やか）
                    const saturation = Math.pow(normalizedVal, 0.3) * 100;

                    // 明るさ: 音量連動（小さいと100%白、大きいと50%原色）
                    const lightness = 100 - (normalizedVal * 50); 
                    
                    const alpha = 0.8 + (normalizedVal * 0.2);

                    path.style.fill = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
                });
                
                // ★文字（黒いパーツ）の色変化処理は完全に削除しました★
                // これにより、文字は常に静止した黒になります。
            }
            animate();
        } catch (error) {
            console.error(error);
            alert('マイク許可が必要です。');
        }
    }

    startButton.addEventListener('click', () => {
        startButton.style.opacity = '0';
        setTimeout(() => startButton.style.display = 'none', 500);
        startAudio();
    });
    </script>
